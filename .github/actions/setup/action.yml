name: Set up bun and the repository
description: bun, the bun package cache, bun install, and optionally the pinned ONNX models. Never touches datasets.
inputs:
  models:
    description: 'also restore and fetch the ONNX models (pinned sha256)'
    default: 'false'
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2

    - name: Cache bun packages
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

    - run: bun install --frozen-lockfile
      shell: bash

    - name: ONNX model cache key (the pinned sha256 values)
      id: modelkey
      if: inputs.models == 'true'
      shell: bash
      run: |
        key=$(grep -oE "sha256: '[0-9a-f]{64}'" scripts/fetch-models.ts | sort | sha256sum | cut -d' ' -f1)
        echo "key=$key" >> "$GITHUB_OUTPUT"

    - name: Restore ONNX models
      if: inputs.models == 'true'
      uses: actions/cache@v4
      with:
        path: bench/models
        key: onnx-models-${{ steps.modelkey.outputs.key }}

    - name: Fetch models (verifies the pinned sha256)
      if: inputs.models == 'true'
      shell: bash
      run: bun scripts/fetch-models.ts
