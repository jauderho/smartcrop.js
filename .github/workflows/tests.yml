name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: ['*']

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun fmt --check
      - run: bun --bun run lint
      - run: bun check
      - run: bun test
