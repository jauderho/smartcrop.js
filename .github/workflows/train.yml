name: Train

# Retrains the learned crop scorer on a GitHub runner so that training never
# depends on one laptop. Manual only: never on push, pull_request or schedule.
#
# Data policy (see docs/training-efficiency.md):
#   * GAICD and FCDB are downloaded fresh in every run by each inference job
#     and die with its runner. They are never put in actions/cache. Raw images
#     and plug-in caches never leave a runner. Feature-dump shards (derived
#     from the datasets) pass between the jobs of one run as artifacts with
#     retention-days 1, and the cleanup job deletes them at the end of the run.
#   * Only the ONNX models (pinned sha256), bun's package cache, and the trained
#     weights + metrics are cached across runs.
#   * Nothing is committed or pushed. The owner reviews the artifact, then
#     commits src/learned-cnn-weights.ts (or learned-weights.ts) and
#     src/weights-manifest.json by hand.
#
# Shape: parallel jobs, all on arm64.
#   plan     validate inputs, fingerprint, weights cache lookup
#   pca      (only with refit_pca) fit the cnn projection once
#   infer    matrix of infer_jobs jobs; each downloads the two datasets it needs
#            and runs 4 processes x 1 ONNX thread: plug-in inference + feature
#            dump of its shards (--shard s/S, S = 4 * infer_jobs)
#   train    matrix, one job per ensemble member; merges the dump shards
#            (dump.ts --merge S) and trains one seed
#   finish   merge, combine, gate, shrink, manifest, artifact, weights cache
#   cleanup  always: deletes every artifact of this run except the weights
# The dump merges shards in input order, so the dumps (and the weights) do not
# depend on infer_jobs; see docs/training-efficiency.md.
#
on:
  workflow_dispatch:
    inputs:
      cnn:
        description: 'cnn pooling grid K (3 = shipped cnn head, 0 = hand-feature model only)'
        default: '3'
        required: true
      hidden:
        description: 'hidden layer sizes, comma separated'
        default: '32,32'
        required: true
      l2:
        description: 'L2 weight decay'
        default: '3e-3'
        required: true
      lr:
        description: 'learning rate'
        default: '2e-3'
        required: true
      epochs:
        description: 'epochs'
        default: '30'
        required: true
      fcdb:
        description: 'weight of the FCDB-train windows in the loss (0 = off, no holdout)'
        default: '0.5'
        required: true
      ppi:
        description: 'training pairs per image per epoch'
        default: '64'
        required: true
      lambda:
        description: 'LambdaRank pair weighting mix (0 = off)'
        default: '0'
        required: true
      ema:
        description: 'EMA decay of the weights (0 = off)'
        default: '0'
        required: true
      cosine:
        description: 'cosine learning-rate decay'
        type: boolean
        default: false
      ensemble:
        description: 'ensemble members (seeds seed .. seed+N-1, one job each); averaging seeds cuts training noise'
        default: '4'
        required: true
      seed:
        description: 'first seed'
        default: '1'
        required: true
      refit_pca:
        description: 'refit the cnn PCA projection on GAICD-train (default: reuse the shipped one)'
        type: boolean
        default: false
      gate_tolerance:
        description: 'fail when the new model scores below the shipped one by more than this (val SRCC + holdout IoU); 0.01 is the measured seed-to-seed spread'
        default: '0.01'
        required: true
      infer_jobs:
        description: 'inference jobs (4 processes each); the result does not depend on it'
        default: '8'
        required: true
      force:
        description: 'retrain even if weights for this fingerprint are cached'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: train
  cancel-in-progress: false

env:
  IN_CNN: ${{ inputs.cnn }}
  IN_HIDDEN: ${{ inputs.hidden }}
  IN_L2: ${{ inputs.l2 }}
  IN_LR: ${{ inputs.lr }}
  IN_EPOCHS: ${{ inputs.epochs }}
  IN_FCDB: ${{ inputs.fcdb }}
  IN_PPI: ${{ inputs.ppi }}
  IN_LAMBDA: ${{ inputs.lambda }}
  IN_EMA: ${{ inputs.ema }}
  IN_COSINE: ${{ inputs.cosine }}
  IN_ENSEMBLE: ${{ inputs.ensemble }}
  IN_SEED: ${{ inputs.seed }}
  IN_REFIT: ${{ inputs.refit_pca }}
  IN_TOLERANCE: ${{ inputs.gate_tolerance }}
  IN_INFER_JOBS: ${{ inputs.infer_jobs }}
  IN_FORCE: ${{ inputs.force }}
  GH_TOKEN: ${{ github.token }}
  # plug-in outputs depend on the ONNX thread count: 1 everywhere
  SMARTCROP_ORT_THREADS: '1'

# arm64: ONNX outputs match Apple Silicon laptops bit for bit (x64 kernels
# differ slightly), so runner and laptop training are reproducible.
jobs:
  plan:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    outputs:
      config: ${{ steps.fp.outputs.config }}
      fp: ${{ steps.fp.outputs.fp }}
      short: ${{ steps.fp.outputs.short }}
      hit: ${{ steps.wcache.outputs.cache-hit == 'true' }}
      infer_matrix: ${{ steps.fp.outputs.infer_matrix }}
      seed_matrix: ${{ steps.fp.outputs.seed_matrix }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate inputs
        run: |
          set -eu
          re='^[0-9.,e+-]+$'
          for v in IN_CNN IN_HIDDEN IN_L2 IN_LR IN_EPOCHS IN_FCDB IN_PPI IN_LAMBDA IN_EMA IN_ENSEMBLE IN_SEED IN_TOLERANCE IN_INFER_JOBS; do
            val="${!v}"
            if ! printf '%s' "$val" | grep -Eq "$re"; then
              echo "::error::$v='$val' is not a plain number"; exit 1
            fi
          done
          [ "$IN_ENSEMBLE" -ge 1 ] && [ "$IN_ENSEMBLE" -le 16 ] || { echo "::error::ensemble must be 1..16"; exit 1; }
          [ "$IN_INFER_JOBS" -ge 1 ] && [ "$IN_INFER_JOBS" -le 32 ] || { echo "::error::infer_jobs must be 1..32"; exit 1; }

      - uses: ./.github/actions/setup

      - name: Fingerprint
        id: fp
        run: |
          set -eu
          config=$(jq -cn \
            --arg cnn "$IN_CNN" --arg hidden "$IN_HIDDEN" --arg l2 "$IN_L2" --arg lr "$IN_LR" \
            --arg epochs "$IN_EPOCHS" --arg fcdb "$IN_FCDB" --arg ppi "$IN_PPI" \
            --arg lambda "$IN_LAMBDA" --arg ema "$IN_EMA" --arg ensemble "$IN_ENSEMBLE" \
            --arg seed "$IN_SEED" --arg cosine "$IN_COSINE" --arg refit "$IN_REFIT" \
            '{cnn:($cnn|tonumber), hidden:$hidden, l2:($l2|tonumber), lr:($lr|tonumber),
              epochs:($epochs|tonumber), fcdb:($fcdb|tonumber), ppi:($ppi|tonumber),
              lambda:($lambda|tonumber), ema:($ema|tonumber), ensemble:($ensemble|tonumber),
              seed:($seed|tonumber), cosine:($cosine=="true"), refitPca:($refit=="true")}')
          fp=$(bun scripts/weights-fingerprint.ts --config "$config")
          {
            echo "config=$config"
            echo "fp=$fp"
            echo "short=${fp:0:12}"
            echo "infer_matrix=$(jq -cn --argjson n "$IN_INFER_JOBS" '[range(0; $n)]')"
            echo "seed_matrix=$(jq -cn --argjson s "$IN_SEED" --argjson n "$IN_ENSEMBLE" '[range($s; $s + $n)]')"
          } >> "$GITHUB_OUTPUT"
          echo "fingerprint $fp"
          echo "$config"

      - name: Restore trained weights for this fingerprint
        id: wcache
        if: ${{ !inputs.force }}
        uses: actions/cache/restore@v4
        with:
          path: out/weights
          key: weights-${{ steps.fp.outputs.fp }}

      - name: Weights already trained for this fingerprint
        if: steps.wcache.outputs.cache-hit == 'true'
        run: |
          {
            echo "### Reused cached weights"
            echo "Fingerprint \`${{ steps.fp.outputs.fp }}\` was trained before; nothing was retrained (set **force** to retrain)."
            echo
            cat out/weights/gate.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the cached weights and metrics
        if: steps.wcache.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trained-weights-${{ steps.fp.outputs.short }}
          path: out/weights
          retention-days: 30

  # Refit of the cnn projection on GAICD-train (once, so that every shard uses
  # the same one). Skipped by default: the shipped projection is reused.
  pca:
    needs: plan
    if: needs.plan.outputs.hit != 'true' && inputs.cnn != '0' && inputs.refit_pca
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          models: 'true'
      - name: Download GAICD (fresh; never cached)
        run: bun scripts/fetch-datasets.ts gaicd --clean-archives --concurrency 4
      - name: Fit the projection
        run: bun bench/learned/cnn-pca.ts
      - name: Share the projection within this run
        uses: actions/upload-artifact@v4
        with:
          name: projection
          path: bench/out/cnn/projection.bin
          retention-days: 1

  infer:
    needs: [plan, pca]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.hit != 'true' && (needs.pca.result == 'success' || needs.pca.result == 'skipped') }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    strategy:
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.infer_matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          models: 'true'

      - name: Download datasets (fresh; never cached)
        timeout-minutes: 60
        run: |
          df -h .
          bun scripts/fetch-datasets.ts gaicd fcdb --clean-archives --concurrency 4
          du -sh bench/datasets/*

      - name: Check the downloaded datasets are complete
        run: |
          # The gate compares against weights trained on the full splits; dead
          # Flickr links would silently change the data. Loosen on purpose only.
          bun -e "
          const n = async (p, k) => { const c = {}; for (const a of await Bun.file(p).json()) c[a[k]] = (c[a[k]] || 0) + 1; return c };
          const g = await n('bench/datasets/gaicd/candidates.json', 'split');
          const f = await n('bench/datasets/fcdb/annotations.json', 'split');
          console.log('gaicd', g, 'fcdb', f);
          if (g.train !== 2636 || g.val !== 200 || f.train !== 1369) { console.error('dataset splits are incomplete'); process.exit(1) }"

      - name: Projection (refit from the pca job, or the shipped one)
        if: inputs.cnn != '0' && inputs.refit_pca
        uses: actions/download-artifact@v5
        with:
          name: projection
          path: bench/out/cnn

      - name: Projection (shipped)
        if: inputs.cnn != '0' && !inputs.refit_pca
        run: bun bench/learned/projection-from-shipped.ts

      - name: Plug-in inference and feature dump of this job's shards, 4 processes x 1 thread
        timeout-minutes: 90
        run: |
          # shellcheck disable=SC2086,SC2016
          set -eu
          S=$((IN_INFER_JOBS * 4))
          if [ "$IN_CNN" != "0" ]; then
            with="--with faces,saliency,cnn --cnnk $IN_CNN"
          else
            with=""
          fi
          # Shard s of S is every S-th image starting at s, in every dataset
          # and split. Caches are per image, so shards never overlap.
          shard() {
            s=$1
            for job in "gaicd train" "gaicd val" "fcdb train"; do
              set -- $job
              if [ "$IN_CNN" != "0" ]; then
                bun bench/precompute.ts "$1" --split "$2" --shard "$s/$S"
              fi
              bun bench/learned/dump.ts --dataset "$1" --split "$2" $with --shard "$s/$S"
            done
          }
          pids=""
          for p in 0 1 2 3; do
            shard $((${{ matrix.job }} * 4 + p)) &
            pids="$pids $!"
          done
          rc=0
          for pid in $pids; do wait "$pid" || rc=1; done
          [ "$rc" = 0 ] || { echo "::error::a shard failed"; exit 1; }
          du -sh bench/out/cache bench/out/learned

      - name: Share the dump shards within this run
        uses: actions/upload-artifact@v4
        with:
          name: shards-${{ matrix.job }}
          path: bench/out/learned/*.shard*
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

  train:
    needs: [plan, infer]
    # success() would also look at the skipped pca job
    if: ${{ !cancelled() && needs.infer.result == 'success' }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 240
    strategy:
      matrix:
        seed: ${{ fromJSON(needs.plan.outputs.seed_matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Download the dump shards of this run
        uses: actions/download-artifact@v5
        with:
          pattern: shards-*
          merge-multiple: true
          path: bench/out/learned

      - name: Merge the dump shards
        run: |
          # shellcheck disable=SC2086,SC2016
          set -eu
          S=$((IN_INFER_JOBS * 4))
          if [ "$IN_CNN" != "0" ]; then
            with="--with faces,saliency,cnn --cnnk $IN_CNN"
          else
            with=""
          fi
          for job in "gaicd train" "gaicd val" "fcdb train"; do
            set -- $job
            bun bench/learned/dump.ts --dataset "$1" --split "$2" $with --merge "$S"
          done
          ls -la bench/out/learned

      - name: Train ensemble member (seed ${{ matrix.seed }})
        run: |
          # shellcheck disable=SC2086,SC2016
          set -eu
          mkdir -p out/members
          flags="--hidden $IN_HIDDEN --l2 $IN_L2 --lr $IN_LR --epochs $IN_EPOCHS --fcdb $IN_FCDB --ppi $IN_PPI --lambda $IN_LAMBDA --ema $IN_EMA"
          [ "$IN_CNN" != "0" ] && flags="$flags --cnn $IN_CNN"
          [ "$IN_COSINE" = "true" ] && flags="$flags --cosine"
          echo "train.ts $flags"
          seed=${{ matrix.seed }}
          bun bench/learned/train.ts $flags --seed "$seed" --write --out "out/members/m$seed.json" > "out/members/m$seed.log" 2>&1 || { echo "member $seed failed"; tail -20 "out/members/m$seed.log"; exit 1; }
          grep -h '^hidden=' "out/members/m$seed.log"

      - name: Share the member within this run
        uses: actions/upload-artifact@v4
        with:
          name: member-${{ matrix.seed }}
          path: out/members
          retention-days: 1
          if-no-files-found: error

  finish:
    needs: [plan, train]
    if: ${{ !cancelled() && needs.train.result == 'success' }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write # delete a stale weights cache entry on force
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Download the dump shards of this run
        uses: actions/download-artifact@v5
        with:
          pattern: shards-*
          merge-multiple: true
          path: bench/out/learned

      - name: Download the ensemble members of this run
        uses: actions/download-artifact@v5
        with:
          pattern: member-*
          merge-multiple: true
          path: out/members

      - name: Merge the dump shards used by the gate
        run: |
          # shellcheck disable=SC2086,SC2016
          set -eu
          S=$((IN_INFER_JOBS * 4))
          if [ "$IN_CNN" != "0" ]; then
            with="--with faces,saliency,cnn --cnnk $IN_CNN"
          else
            with=""
          fi
          for job in "gaicd val" "fcdb train"; do
            set -- $job
            bun bench/learned/dump.ts --dataset "$1" --split "$2" $with --merge "$S"
          done

      - name: Projection (refit from the pca job, or the shipped one)
        if: inputs.cnn != '0' && inputs.refit_pca
        uses: actions/download-artifact@v5
        with:
          name: projection
          path: bench/out/cnn

      - name: Projection (shipped)
        if: inputs.cnn != '0' && !inputs.refit_pca
        run: bun bench/learned/projection-from-shipped.ts

      - name: Combine members
        run: |
          # shellcheck disable=SC2086,SC2016
          set -eu
          members=$(seq "$IN_SEED" $((IN_SEED + IN_ENSEMBLE - 1)) | sed 's|.*|out/members/m&.json|')
          bun bench/learned/combine.ts out/weights/model-full.json $members

      - name: Validation gate (new vs shipped, validation data only)
        id: gate
        continue-on-error: true
        run: |
          set -eu
          bun bench/learned/gate.ts out/weights/model-full.json --cnn "$IN_CNN" --fcdb "$IN_FCDB" \
            --tolerance "$IN_TOLERANCE" --report out/weights/gate.json --markdown out/weights/gate.md

      - name: Shrink to packed weights and write the manifest
        run: |
          set -eu
          if [ "$IN_CNN" != "0" ]; then w=learned-cnn-weights.ts; else w=learned-weights.ts; fi
          bun bench/learned/shrink.ts out/weights/model-full.json --out "out/weights/$w" | tee out/weights/shrink.log
          cp src/weights-manifest.json out/weights/weights-manifest.json 2>/dev/null || true
          bun scripts/weights-fingerprint.ts --write --config '${{ needs.plan.outputs.config }}' \
            --weights "out/weights/$w" --manifest out/weights/weights-manifest.json \
            --metrics "$(cat out/weights/gate.json)"
          cp out/members/*.log out/weights/ 2>/dev/null || true
          echo '${{ needs.plan.outputs.config }}' > out/weights/config.json
          echo "${{ needs.plan.outputs.fp }}" > out/weights/fingerprint.txt

      - name: Job summary
        if: always()
        run: |
          # shellcheck disable=SC2086,SC2016
          {
            echo "### Training result"
            echo "Fingerprint \`${{ needs.plan.outputs.fp }}\`"
            echo
            echo '```json'; cat out/weights/config.json 2>/dev/null || echo '${{ needs.plan.outputs.config }}'; echo '```'
            echo
            cat out/weights/gate.md 2>/dev/null || echo "gate did not run"
            echo
            echo "Members:"; echo '```'; grep -h '^hidden=' out/members/m*.log 2>/dev/null || true; echo '```'
            echo
            echo "Review the artifact, then commit the packed weights and \`weights-manifest.json\` by hand."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check that the outputs hold only weights and metrics
        if: always()
        run: |
          set -eu
          [ -d out/weights ] || exit 0
          bad=$(find out/weights -type f ! \( -name '*.json' -o -name '*.ts' -o -name '*.md' -o -name '*.log' -o -name '*.txt' \) -print)
          big=$(find out/weights -type f -size +20M -print)
          if [ -n "$bad$big" ]; then echo "::error::unexpected files in the output: $bad $big"; exit 1; fi

      - name: Upload weights and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trained-weights-${{ needs.plan.outputs.short }}
          path: out/weights
          retention-days: 30
          if-no-files-found: warn

      - name: Drop a stale cache entry (force)
        if: inputs.force && steps.gate.outcome == 'success'
        run: gh cache delete "weights-${{ needs.plan.outputs.fp }}" || true

      - name: Store weights in the cache (only if the gate passed)
        if: steps.gate.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: out/weights
          key: weights-${{ needs.plan.outputs.fp }}

      - name: Fail the run when the gate failed
        if: steps.gate.outcome == 'failure'
        run: |
          echo "::error::The new model does not beat the shipped one on validation (see the summary). The artifact is kept for inspection; it was not cached."
          exit 1

  # Data policy: nothing derived from the datasets may outlive the run. Delete
  # every artifact of this run except the trained weights and metrics.
  cleanup:
    needs: [plan, pca, infer, train, finish]
    if: always()
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Delete this run's intermediate artifacts
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -eu
          ids=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("trained-weights-") | not) | "\(.id) \(.name)"')
          [ -n "$ids" ] || { echo "no intermediate artifacts"; exit 0; }
          fail=0
          while read -r id name; do
            if gh api -X DELETE "repos/$REPO/actions/artifacts/$id" >/dev/null; then
              echo "deleted $name ($id)"
            else
              echo "::error::could not delete $name ($id)"; fail=1
            fi
          done <<< "$ids"
          # the listing lags behind deletions for a few seconds
          left=-1
          for _ in 1 2 3 4 5 6; do
            left=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
              --jq '.artifacts[] | select((.name | startswith("trained-weights-") | not) and (.expired | not)) | .name' | wc -l)
            [ "$left" -eq 0 ] && break
            sleep 5
          done
          echo "intermediate artifacts left: $left"
          [ "$fail" = 0 ] && [ "$left" = 0 ]
