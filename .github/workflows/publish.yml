name: Publish

# Disabled: npm publishing is off for this fork; releases are made on GitHub.
# Manual runs only. To re-enable on releases, restore:
#   on:
#     release:
#       types: [published]
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Gate: the shipped learned weights must have been trained by the current
  # training code (fails with a pointer to the Train workflow when stale).
  weights-fresh:
    uses: ./.github/workflows/weights-fresh.yml
    permissions:
      contents: read
      actions: read

  publish:
    needs: weights-fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun publish
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
