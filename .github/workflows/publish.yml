name: Publish

# Disabled: npm publishing is off for this fork; releases are made on GitHub.
# Manual runs only. To re-enable on releases, restore:
#   on:
#     release:
#       types: [published]
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun publish
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
